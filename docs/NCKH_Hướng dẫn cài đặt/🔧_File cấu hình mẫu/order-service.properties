# Order Service Configuration
# Copy to: backend/order-service/Nckh-C-ng/src/main/resources/application.properties

# Server Port
server.port=8002
server.address=0.0.0.0

# SQL Server Database Configuration
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=order_dB;encrypt=true;trustServerCertificate=true;
spring.datasource.username=orderuser
spring.datasource.password=Order@123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.SQLServer2012Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Logging
logging.level.root=INFO
logging.level.com.example.order_service=DEBUG
