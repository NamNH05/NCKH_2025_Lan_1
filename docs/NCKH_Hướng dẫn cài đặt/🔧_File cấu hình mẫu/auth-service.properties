# Auth Service Configuration
# Copy to: backend/auth-service/Nckh-Lu-n/src/main/resources/application.properties

# Server Port
server.port=8001
server.address=0.0.0.0

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/nckh_auth?timezone=Asia/Ho_Chi_Minh
spring.datasource.username=auth_user
spring.datasource.password=auth@123456
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Redis Configuration (for caching)
spring.data.redis.host=localhost
spring.data.redis.port=6379

# JWT Configuration
# ⚠️ Use environment variable JWT_SECRET from .env file
# DO NOT commit actual JWT secrets to Git
jwt.secret=${JWT_SECRET:}
jwt.expiration=86400000

# Bootstrap Admin User
# ⚠️ Use environment variable ADMIN_PASSWORD from .env file
bootstrap.admin.username=sysadmin
bootstrap.admin.password=${ADMIN_PASSWORD:}

# Logging
logging.level.root=INFO
logging.level.vn.id.luannv=DEBUG
