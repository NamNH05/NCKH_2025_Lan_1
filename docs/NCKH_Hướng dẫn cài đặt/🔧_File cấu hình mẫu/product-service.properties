# Product Service Configuration
# Copy to: backend/product-service/Tien/Tien/src/main/resources/application.properties

# Server Port
server.port=8003
server.address=0.0.0.0

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/shopquanao?useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=product_user
spring.datasource.password=product@123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Logging
logging.level.root=INFO
logging.level.com.BackEnd_Tien=DEBUG
