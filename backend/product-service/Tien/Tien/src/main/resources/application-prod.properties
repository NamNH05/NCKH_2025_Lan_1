##############################################################################
# PRODUCTION CONFIGURATION - Product Service
# Active: java -Dspring.profiles.active=prod -jar product-service.jar
##############################################################################

spring.application.name=Tien-Product
server.port=8081

# Database Configuration (Production)
spring.datasource.url=jdbc:mysql://prod-db-server:3306/shopquanao
spring.datasource.username=prod_user
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (Production: smaller pool, more conservative)
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

##############################################################################
# PRODUCTION LOGGING CONFIGURATION
##############################################################################

# File-based logging
logging.file.name=/var/log/services/product-service.log
logging.file.max-size=50MB
logging.file.max-history=30
logging.file.total-size-cap=1500MB

# Logging Levels
logging.level.root=WARN
logging.level.org.springframework=ERROR
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=INFO
logging.level.com.BackEnd_Tien=INFO

# Pattern
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.charset.file=UTF-8
