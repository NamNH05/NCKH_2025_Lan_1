##############################################################################
# PRODUCTION CONFIGURATION - Order Service
# Active: java -Dspring.profiles.active=prod -jar order-service.jar
##############################################################################

spring.application.name=order-service-prod
server.port=8091

# Database Configuration (Production)
spring.datasource.url=jdbc:sqlserver://prod-db-server:1433;databaseName=order_dB;encrypt=true;trustServerCertificate=true;loginTimeout=30
spring.datasource.username=orderuser_prod
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Connection Pool (Production: more conservative)
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=false

# Error Handling (Production: less detailed)
server.error.include-message=always
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

##############################################################################
# PRODUCTION LOGGING CONFIGURATION
##############################################################################

# File-based logging
logging.file.name=/var/log/services/order-service.log
logging.file.max-size=50MB
logging.file.max-history=30
logging.file.total-size-cap=1500MB

# Logging Levels
logging.level.root=WARN
logging.level.org.springframework=ERROR
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=INFO
logging.level.com.example.order=INFO

# Pattern
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.charset.file=UTF-8
