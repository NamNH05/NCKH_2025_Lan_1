version: "3.9"

services:
  order-sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: order-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "SqlServer@2026"
      MSSQL_PID: "Express"
      MSSQL_CONFIG_PATH: /var/opt/mssql/mssql.conf
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./certs/sqlserver.pem:/var/opt/mssql/certs/sqlserver.pem:ro
      - ./certs/sqlserver.key:/var/opt/mssql/certs/sqlserver.key:ro
      - ./mssql.conf:/var/opt/mssql/mssql.conf:ro
    healthcheck:
      test: [
        "CMD",
        "/opt/mssql-tools18/bin/sqlcmd",
        "-S", ".",
        "-U", "sa",
        "-P", "SqlServer@2026",
        "-Q", "SELECT 1",
        "-C"
      ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  sqlserver_data:
